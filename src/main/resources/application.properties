spring.application.name=linkforge

# --- Database (H2, file-based, zero config) ---
# Data persists between restarts in ./data/linkforge.mv.db
spring.datasource.url=jdbc:h2:file:./data/linkforge;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 web console at /h2-console (JDBC URL above, user "sa", blank password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- App ---
# Public base URL used when building short links. Override for deployment,
# e.g. app.base-url=https://yourdomain.com
app.base-url=http://localhost:8080

server.port=8080

# --- File upload (CSV import) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
